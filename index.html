<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Nibble</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header id="site-header"></header>

  <main>
  <section class="hero">
    <h1 class="hero__title">Find something to cook</h1>
    <p class="hero__tag">Search by name or ingredient below.</p>
  </section>
  
<section class="search-area">
  <form id="search-form" class="search">
    <input
      id="search-input"
      type="text"
      placeholder="Search for a recipe (e.g. chicken)"
      aria-label="Search recipes"
    />
    <button id="search-btn" type="submit">Search</button>
  </form>

  <div id="filters" class="chips">
    <button class="chip" data-filter="i=chicken">Chicken</button>
    <button class="chip" data-filter="c=Vegetarian">Vegetarian</button>
    <button class="chip" data-filter="a=Italian">Italian</button>
  </div>
</section>

<section>
  <h2 class="section-title">Results</h2>
  <div id="results" class="grid"></div>
  <p id="empty-state" class="muted">Try a search to see recipes.</p>
</section>

  <section>
    <p>Results will go here later.</p>
  </section>
</main>

<footer class="footer">
  <small>© 2025 Nibble</small>
</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

  <script src="js/main.js" defer></script>
</body>

</html>
