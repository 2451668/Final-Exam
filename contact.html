<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Nibble</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="contact" >
  <header id="site-header"></header>

  <main class="container contact-wrap">
  <section class="contact-copy">
    <h1>About</h1>
    <p class="muted">
      Nibble is a small recipe finder that helps users search by name or
      ingredient and view clear instructions and ingredients for each dish.
    </p>
    <p class="muted">
      The project focuses on clean UI, accessibility, and a light use of
      animation for clarity rather than decoration.
    </p>

    <h2 class="contact-heading">Get in touch</h2>

    <form id="contact-form" novalidate>
      <label>
        Name
        <input id="name" type="text" required />
        <small class="hint" id="name-hint"></small>
      </label>

      <label>
        Email
        <input id="email" type="email" required />
        <small class="hint" id="email-hint"></small>
      </label>

      <label>
        Message
        <textarea id="message" rows="5" required></textarea>
        <small class="hint" id="message-hint"></small>
      </label>

      <button type="submit">Send</button>
    </form>
  </section>

  <aside class="contact-media">
    <img src="assets/contact.jpg" alt="Assorted fresh ingredients on a table" />
  </aside>
</main>



  <footer>
    <small>© 2025 Nibble</small>
  </footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

  <script src="js/main.js" defer></script>
</body>

</html>
